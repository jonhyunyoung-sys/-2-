<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DOOM 3D: 배움의 던전 - Gimkit Doom Edition</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030712;
      font-family: 'Pretendard', -apple-system, sans-serif;
    }
    #doomCanvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    /* Top Mini HUD */
    .doom-top-hud {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 20;
    }
    .doom-pill {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 0.35rem 0.8rem;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 800;
      color: #fff;
      backdrop-filter: blur(4px);
      pointer-events: auto;
    }
    /* Toast Notification */
    #doomNotification {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      border: 2px solid #ef4444;
      color: #f87171;
      padding: 0.5rem 1.4rem;
      border-radius: 999px;
      font-weight: 900;
      font-size: 0.95rem;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
      z-index: 30;
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
      white-space: nowrap;
    }
    /* Mobile Touch Controls */
    .touch-controls {
      display: none;
      position: absolute;
      bottom: 85px;
      left: 15px;
      right: 15px;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      z-index: 25;
    }
    @media (max-width: 900px), (pointer: coarse) {
      .touch-controls {
        display: flex;
      }
    }
    .touch-btn {
      pointer-events: auto;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 900;
      font-size: 1.1rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      cursor: pointer;
      user-select: none;
    }
    .btn-shoot {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #fff;
      border: 3px solid #fca5a5;
    }
    .btn-quiz {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      border: 3px solid #7dd3fc;
    }
  </style>
</head>
<body>
  <!-- 3D Canvas -->
  <canvas id="doomCanvas"></canvas>

  <!-- Top Mini Navigation -->
  <div class="doom-top-hud">
    <div style="display: flex; gap: 0.5rem; align-items: center;">
      <a href="/" class="doom-pill" style="text-decoration: none; color: #ef4444; border-color: #ef4444;">
        💀 DOOM 3D
      </a>
      <div id="hudModeBadge" class="doom-pill" style="color: #f59e0b; border-color: #f59e0b;">
        🎯 몬스터 사냥
      </div>
      <div id="hudTeamBadge" class="doom-pill" style="display: none; color: #38bdf8; border-color: #38bdf8;">
        👥 소속 조: -
      </div>
      <div class="doom-pill" style="color: #cbd5e1;">
        [WASD/방향키]: 이동 | [Space/클릭]: 사격 | [E]: 퀴즈 풀기
      </div>
    </div>

    <div style="display: flex; gap: 0.5rem;">
      <button class="doom-pill" style="cursor: pointer; border-color: #f59e0b;" onclick="doomSound.toggleBgm()">
        🎵 BGM ON/OFF
      </button>
      <button class="doom-pill" style="cursor: pointer; border-color: #38bdf8;" onclick="checkInteraction()">
        📖 퀴즈 풀기 [E]
      </button>
    </div>
  </div>

  <!-- Notification Toast -->
  <div id="doomNotification">알림 메시지</div>

  <!-- Mobile Touch Controls -->
  <div class="touch-controls">
    <div style="display: flex; flex-direction: column; gap: 0.5rem; pointer-events: auto;">
      <div style="display: flex; gap: 0.5rem;">
        <button class="touch-btn btn-quiz" style="width: 55px; height: 55px; font-size: 0.9rem;" onclick="rotatePlayer(-0.25)">⟲ 좌</button>
        <button class="touch-btn btn-quiz" style="width: 55px; height: 55px; font-size: 0.9rem;" onclick="rotatePlayer(0.25)">⟳ 우</button>
      </div>
      <button class="touch-btn btn-quiz" style="width: 115px; border-radius: 12px; height: 48px; font-size: 0.9rem;" id="touchQuizBtn">
        📖 퀴즈 [E]
      </button>
    </div>

    <div style="display: flex; gap: 0.6rem;">
      <button class="touch-btn btn-shoot" id="touchShootBtn">
        🔥 사격
      </button>
    </div>
  </div>

  <!-- QUIZ MODAL (Cyberpunk Doom Style) -->
  <div id="doomQuizModal" class="modal-backdrop" style="display: none; z-index: 9999;">
    <div class="modal-box" style="max-width: 560px; width: 92%; text-align: left; padding: 1.8rem; border: 2px solid #38bdf8; background: rgba(15, 23, 42, 0.95); box-shadow: 0 0 35px rgba(56, 189, 248, 0.35);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; border-bottom: 1px solid rgba(56, 189, 248, 0.3); padding-bottom: 0.6rem;">
        <h3 id="doomQuizTitle" style="font-size: 1.2rem; font-weight: 900; margin: 0; color: #38bdf8; display: flex; align-items: center; gap: 0.4rem;">
          ⚡ 배움의 퀴즈 스테이션
        </h3>
        <button class="btn btn-outline" style="padding: 0.2rem 0.5rem; font-size: 0.8rem;" onclick="closeQuizModal()">✕</button>
      </div>

      <div id="doomQuestionText" style="font-size: 1.15rem; font-weight: 800; color: #fff; line-height: 1.5; margin-bottom: 1.2rem;">
        문제를 불러오는 중입니다...
      </div>

      <div id="doomOptionsContainer" style="display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1rem;">
        <!-- Dynamic Options -->
      </div>

      <div style="font-size: 0.75rem; color: #94a3b8; text-align: center;">
        💡 키보드 숫자 [1 ~ 4] 또는 터치로 정답을 선택하세요. 정답 시 탄약 만충 및 BFG 버프 충전!
      </div>
    </div>
  </div>

  <!-- STUDENT JOIN MODAL (Attendance No. & Nickname) -->
  <div id="doomJoinModal" class="modal-backdrop" style="display: flex; z-index: 10000;">
    <div class="modal-box" style="max-width: 420px; width: 92%; text-align: center; padding: 1.6rem; border: 2px solid #ef4444; background: rgba(15, 23, 42, 0.96);">
      <div style="font-size: 2.8rem; margin-bottom: 0.2rem;">💀</div>
      <h2 style="font-size: 1.5rem; font-weight: 900; margin-bottom: 0.3rem; color: #fff; text-shadow: 0 0 10px rgba(239, 68, 68, 0.6);">
        DOOM 3D 던전 입장
      </h2>
      <p style="color: #94a3b8; font-size: 0.85rem; margin-bottom: 1.2rem;">
        출석번호와 별명을 입력하고 던전에 잠입하세요!
      </p>

      <form id="doomJoinForm" onsubmit="submitDoomJoin(event)" style="display: flex; flex-direction: column; gap: 0.85rem; text-align: left;">
        <div>
          <label style="display: block; font-size: 0.8rem; font-weight: 800; color: #ef4444; margin-bottom: 0.3rem;">
            출석 번호 (선택)
          </label>
          <input type="number" id="inputStudentNo" min="1" max="60" placeholder="예: 7 (숫자만 입력)"
            style="width: 100%; padding: 0.75rem 1rem; border-radius: 10px; background: rgba(15, 23, 42, 0.9); border: 2px solid var(--border); color: #fff; font-size: 1.1rem; font-weight: 800; outline: none;" />
        </div>

        <div>
          <label style="display: block; font-size: 0.8rem; font-weight: 800; color: #ef4444; margin-bottom: 0.3rem;">
            이름 또는 별명 (필수)
          </label>
          <input type="text" id="inputNickname" required placeholder="예: 둠슬레이어 또는 김철수" maxlength="12"
            style="width: 100%; padding: 0.75rem 1rem; border-radius: 10px; background: rgba(15, 23, 42, 0.9); border: 2px solid var(--border); color: #fff; font-size: 1.1rem; font-weight: 800; outline: none;" />
        </div>

        <div>
          <label style="display: block; font-size: 0.8rem; font-weight: 800; color: #ef4444; margin-bottom: 0.3rem;">
            아바타 선택
          </label>
          <div id="doomAvatarPicker" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.4rem;">
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.9rem; font-size: 1.15rem; font-weight: 900; margin-top: 0.4rem; background: linear-gradient(135deg, #b91c1c, #ef4444); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);">
          던전 진입하기 🔥
        </button>
      </form>
    </div>
  </div>

  <!-- GAME OVER RESPAWN MODAL -->
  <div id="doomGameOverModal" class="modal-backdrop" style="display: none; z-index: 9999;">
    <div class="modal-box" style="max-width: 380px; width: 90%; text-align: center; padding: 2rem; border: 2px solid #ef4444;">
      <div style="font-size: 3rem; margin-bottom: 0.5rem;">☠️</div>
      <h2 style="font-size: 1.6rem; font-weight: 900; color: #ef4444; margin-bottom: 0.5rem;">YOU DIED</h2>
      <p style="color: #cbd5e1; font-size: 0.9rem; margin-bottom: 1.5rem;">
        악마들의 기습을 당했습니다! 즉시 리스폰하여 복수하세요.
      </p>
      <button class="btn btn-primary" style="width: 100%; padding: 0.9rem; font-size: 1.1rem; font-weight: 900; background: #ef4444;" onclick="respawnPlayer()">
        즉시 부활하기 (Respawn) ⚡
      </button>
    </div>
  </div>

  <!-- GAME END VICTORY MODAL -->
  <div id="doomGameEndModal" class="modal-backdrop" style="display: none; z-index: 10000;">
    <div class="modal-box" style="max-width: 440px; width: 90%; text-align: center; padding: 2rem; border: 2px solid #f59e0b;">
      <div style="font-size: 3.5rem; margin-bottom: 0.5rem;">🏆</div>
      <h2 style="font-size: 1.7rem; font-weight: 900; color: #f59e0b; margin-bottom: 0.5rem;">던전 정복 완료!</h2>
      <p id="doomEndReason" style="color: #cbd5e1; font-size: 0.95rem; margin-bottom: 1.5rem;">
        게임이 종료되었습니다!
      </p>
      <button class="btn btn-primary" style="width: 100%; padding: 0.9rem; font-size: 1.1rem; font-weight: 900;" onclick="location.href='/'">
        홈으로 돌아가기 🏠
      </button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/doom-engine.js"></script>
</body>
</html>
